[package]
name = "nut"
version = "0.1.6"
authors = ["Vyrtsev Mikhail <reeywhaar@gmail.com>"]
homepage = "https://github.com/Reeywhaar/nut"
description = "Bolt DB Port in Rust"
edition = "2024"
rust-version = "1.89"
license = "MIT"
exclude = ["test_data"]

[[bin]]
name = "nut"
required-features = ["cli"]

[[test]]
name = "nut"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:hexdump", "dep:anstyle", "dep:anyhow"]

[dependencies]
fnv = "1.0.7"
poolcache = "0.1.1"
fs4 = "1.1.0"
page_size = "0.6.0"
memmap2 = "0.9.11"
scopeguard = "1.2.0"
bitflags = "2.13.2"
either = "1.19.0"
lock_api = "0.4.14"
parking_lot = "0.12.5"
clap = { version = "4.6.7", features = ["derive"], optional = true }
hexdump = { version = "0.1.3", optional = true }
anstyle = { version = "1.0.14", optional = true }
anyhow = { version = "1.0.104", optional = true }

[dev-dependencies]
rand = "0.10.3"
assert_cmd = "2.2.2"
