name: "Release"

on:
  push:
    tags:
      - "*.*"

jobs:
  release:
    name: "Publish"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install Rust"
        run: rustup update stable && rustup default stable

      - name: "Build"
        run: cargo build

      - name: "Test"
        run: cargo test

      - name: "Publish"
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
