name: "Release"

on:
  push:
    tags:
      - "*.*"

jobs:
  release:
    name: "Publish"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5

      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          override: true

      - uses: Swatinem/rust-cache@v2.8.1

      - name: "Build"
        run: cargo build

      - name: "Test"
        run: cargo test

      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CRATES_TOKEN }}
